name: CumpleFactura - UI y núcleo nativo

on:
  pull_request:
    branches: [main, ux/cumplefactura-fase-1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: UI, contrato y navegador
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHROMEDRIVER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run validate:ui-contract
      - run: npm run validate:secret-scan
      - run: node tools/verify-refactor-contract.mjs
      - run: node --experimental-strip-types --test tests/ui/*.test.mjs
      - run: npm run validate:browser-smoke
      - name: Revisar 76 estados, ambos temas, tamaños y densidades
        run: node tools/verify-phase2-browser.mjs
      - run: node tools/verify-phase2-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-browser-evidence
          path: |
            docs/phase2/browser-results.json
            docs/phase2/flow-result.json
            docs/phase2/screenshots/
            tests/regulatory/evidence/latest-browser-smoke.*

  native-windows:
    name: Rust, SQLite y XSD (Windows)
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CHROMEDRIVER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: rustup default stable
      - run: rustup component add rustfmt
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all --check
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - run: npm run validate:verifactu:xsd
      - run: npm run validate:core-e2e
      - run: cargo install tauri-driver --locked
      - run: npm run tauri:build
      - name: Abrir la ventana Tauri y probar comandos reales
        run: npm run validate:tauri-desktop-e2e
        env:
          CUMPLEFACTURA_TAURI_DESKTOP_E2E_REAL: '1'
      - name: Anotar fallo del E2E nativo
        if: failure()
        shell: pwsh
        run: |
          $path = 'tests/regulatory/evidence/latest-tauri-desktop-e2e.json'
          if (Test-Path $path) {
            $report = Get-Content $path -Raw | ConvertFrom-Json
            $message = ($report | ConvertTo-Json -Depth 8 -Compress)
            $encoded = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Tauri desktop E2E::$encoded"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-native-core-evidence
          path: |
            tests/regulatory/evidence/latest-core-e2e*
            tests/regulatory/evidence/latest-tauri-desktop-e2e*

# Estos jobs no sustituyen validate:regulatory.
# El gate completo conserva sus fuentes normativas y prerrequisitos externos.
