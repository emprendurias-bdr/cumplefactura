<!doctype html>
<html lang="es" data-producto="violeta">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CumpleFactura</title>
    <link rel="icon" href="data:," />
    <!-- Anti-parpadeo de design.md (Anexo A): fija apariencia y color antes de pintar. -->
    <script>
    (function () {
      var d = document.documentElement, a, c;
      try { a = localStorage.getItem('bdr.apariencia'); c = localStorage.getItem('bdr.color'); } catch (e) {}
      if (!a || a === 'auto') a = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
      d.dataset.apariencia = a;
      d.dataset.color = c === 'intenso' ? 'intenso' : 'suave';
    })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
