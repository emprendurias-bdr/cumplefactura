[package]
name = "cumplefactura-sidecar"
description = "Sidecar local de CumpleFactura: unico proceso que usa el certificado y envia registros VERI*FACTU a la AEAT."
edition.workspace = true
version.workspace = true
publish = false

[lib]
name = "cumplefactura_sidecar"
path = "src/lib.rs"

[[bin]]
name = "cumplefactura-sidecar"
path = "src/main.rs"

[dependencies]
fiscal-contract.workspace = true
native-tls = "0.2.18"
roxmltree = "0.21"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
rcgen = "0.14"
