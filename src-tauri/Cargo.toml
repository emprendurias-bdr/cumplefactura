[package]
name = "cumplefactura"
version = "0.1.0"
description = "Desktop local-first invoicing app for Spanish fiscal compliance."
authors = ["CumpleFactura"]
edition = "2021"

[lib]
name = "cumplefactura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cumplefactura"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
qrcode = { version = "0.14", default-features = false }
hex = "0.4"
hmac = "0.12"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "rustls", "ring", "webpki-roots"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["serde", "v4"] }
