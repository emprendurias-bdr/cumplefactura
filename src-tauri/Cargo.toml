[package]
name = "cumplefactura"
version = "0.1.0"
description = "Desktop local-first invoicing app for Spanish fiscal compliance."
authors = ["CumpleFactura"]
edition.workspace = true

[lib]
name = "cumplefactura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cumplefactura"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fiscal-contract.workspace = true
chrono.workspace = true
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# QR tributario VERI*FACTU en el PDF: sin features (solo matriz, sin imágenes).
qrcode = { version = "0.14", default-features = false }
uuid.workspace = true
